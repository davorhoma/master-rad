networks:
  yt-tt-analysis:
    name: yt-tt-analysis
    external: true

services:
  broker1:
    image: apache/kafka:4.1.1
    hostname: broker1
    ports:
      - 29092:29092
    networks:
      - yt-tt-analysis
    volumes:
      - ./config:/home/config
      - ./kafka-data/broker1:/tmp/kraft-combined-logs
    environment:
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker1:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker1:9093,2@broker2:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  broker2:
    image: apache/kafka:4.1.1
    hostname: broker2
    ports:
      - 29093:29093
    networks:
      - yt-tt-analysis
    volumes:
      - ./config:/home/config
      - ./kafka-data/broker2:/tmp/kraft-combined-logs
    environment:
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker2:9092,PLAINTEXT_HOST://localhost:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 2
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker1:9093,2@broker2:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  kafka-ui:
    image: "provectuslabs/kafka-ui:v0.7.2"
    depends_on:
      - broker1
      - broker2
    ports:
      - "8092:8080"
    networks:
      - yt-tt-analysis
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: "broker1:9092,broker2:9092"
      KAFKA_CLUSTERS_0_NAME: local-kafka-cluster

  kafka-init:
    image: apache/kafka:4.1.1
    depends_on:
      - broker1
      - broker2
    networks:
      - yt-tt-analysis
    volumes:
      - ./config:/home/config
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Čekam da Kafka bude spremna...'
      while ! /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server broker1:9092 > /dev/null 2>&1; do
        sleep 2
      done
      echo 'Kafka je spremna! Pokrećem skriptu za kreiranje topic-a...'
      bash /home/config/setupObjects.sh
      "
